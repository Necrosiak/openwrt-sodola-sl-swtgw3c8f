name: Firmware and upstream security refresh
on:
  workflow_dispatch:
    inputs:
      rolling:
        description: Build current upstream as an untested candidate
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      ROLLING: ${{ github.event_name == 'schedule' || inputs.rolling }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve exact upstream source commits
        id: upstream
        if: env.ROLLING == 'true'
        run: python3 scripts/upstream-state.py upstream-lock.json >> "$GITHUB_OUTPUT"
      - name: Check whether these sources already built successfully
        id: cache
        if: env.ROLLING == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .upstream-build-marker
          key: sodola-upstream-success-v1-${{ steps.upstream.outputs.fingerprint }}
          lookup-only: true
      - name: Plan build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$CACHE_HIT" = true ]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'Sources unchanged since a successful build; skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install build dependencies
        if: steps.plan.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd libelf-dev
      - name: Rebuild with local board and PHY fixes
        if: steps.plan.outputs.build == 'true'
        env:
          JOBS: '2'
        run: |
          if [ "$ROLLING" = true ]; then
            scripts/build.sh "$GITHUB_WORKSPACE/build" --rolling --upstream-lock "$GITHUB_WORKSPACE/upstream-lock.json"
          else
            scripts/build.sh "$GITHUB_WORKSPACE/build"
          fi
      - name: Audit and collect candidate
        if: steps.plan.outputs.build == 'true'
        run: |
          python3 scripts/audit.py --tree . --build build
          python3 scripts/collect.py build artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.plan.outputs.build == 'true'
        with:
          name: sodola-candidate-NOT-HARDWARE-TESTED-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Record successful source build
        if: steps.plan.outputs.build == 'true' && env.ROLLING == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir .upstream-build-marker
          cp upstream-lock.json build/resolved-sources.json .upstream-build-marker/
      - name: Cache successful source fingerprint
        if: steps.plan.outputs.build == 'true' && env.ROLLING == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .upstream-build-marker
          key: sodola-upstream-success-v1-${{ steps.upstream.outputs.fingerprint }}
      - name: Validation boundary
        if: steps.plan.outputs.build == 'true'
        run: |
          echo '## Built, not hardware validated' >> "$GITHUB_STEP_SUMMARY"
          echo 'Hourly source checks, not an instant security advisory feed. Upstream refresh may include security fixes and functional changes. No CVE-completeness guarantee. No automatic flash or stable release publication.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If patches no longer apply, the build fails rather than silently dropping them.' >> "$GITHUB_STEP_SUMMARY"
